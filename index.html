<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>羅己のWebページ</title>
  <meta name="description" content="これはスターターページです。内容はあとから自由に差し替えられます。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Starter Site</p>
    <h1>こんにちは、羅己です。</h1>
    <p class="lead">これは無料枠で公開できる静的Webページのたたき台です。自己紹介、ブログ、リンク集、作品紹介など、用途に合わせて内容を差し替えます。</p>
    <div class="card">
      <h2>次に決めること</h2>
      <ul>
        <li>ページの目的（自己紹介 / ブログ / お店 / 作品集 など）</li>
        <li>載せたい文章や写真</li>
        <li>公開先（Cloudflare Pages / GitHub Pages / Netlify など）</li>
      </ul>
    </div>
    <p class="note">このページは今、私のコンピューター上で表示確認できる状態です。</p>
  </main>
</body>
</html>
